name: Release SDK

# Publishes @plimsoll/sdk to the npm registry when a tag matching `sdk-v*`
# is pushed (e.g. `sdk-v0.1.0`). The package is published with npm
# provenance, attesting the build to this repository and commit.

on:
  push:
    tags:
      - "sdk-v*"

permissions:
  contents: read

jobs:
  publish:
    name: publish @plimsoll/sdk
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#sdk-v}"
          PKG=$(node -p "require('./packages/sdk/package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag $TAG does not match packages/sdk/package.json version $PKG"
            exit 1
          fi
      - name: Build SDK
        run: npm run build -w @plimsoll/sdk
      - name: Typecheck SDK
        run: npm run typecheck -w @plimsoll/sdk
      - name: Test SDK (offline)
        run: npm run test -w @plimsoll/sdk
      - name: Publish to npm
        working-directory: packages/sdk
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
